<!doctype html>
<html lang="pt-br">
  <head>
    <!-- Garante que o navegador exiba corretamente acentos, caracteres especiais, emojis e símbolos de diversos idiomas -->
    <meta charset="utf-8" />
    <!-- Garante compatibilidade com o Internet Explorer -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Título da página exibido na aba do navegador -->
    <title>Tela de Login</title>
    <!-- Configura a visualização para dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Importa o arquivo CSS principal para estilização -->
    <link rel="stylesheet" type="text/css" media="screen" href="style.css" />
  </head>
  <body>
    <main id="login">
      <!-- Formulário de login -->
      <form class="form">
        <!-- Título do formulário -->
        <h1>Acessar</h1>
        <!-- Campo para o e-mail do usuário -->
        <label>E-mail</label>
        <input type="email" id="email" name="email" placeholder="Informe seu E-mail"/>
        <!-- Campo para a senha do usuário -->
        <label>Senha</label>
        <input type="password" id="name" name="name" placeholder="Informe sua Senha"/>
        <!-- Botão para enviar o formulário -->
        <button>Entrar</button>
      </form>
    </main>
  </body>
  
</html>
